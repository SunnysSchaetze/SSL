<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSL Icon</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: none;
    display: flex;
    justify-content: center;
    align-items: center;
}
a {
    display: flex;
    justify-content: center;
    align-items: center;
    text-decoration: none;
    transition: transform 0.3s ease, filter 0.3s ease;
}
a:hover img {
    transform: scale(1.2);
    filter: brightness(2) drop-shadow(0 0 20px orange);
}
img {
    max-width: 40%;
    max-height: 40%;
    width: auto;
    height: auto;
    display: block;
}
</style>
</head>
<body>
<a href="https://sites.google.com/view/sunnysschaetze/home/rechtliche-hinweise/ssl-datensicherheit" target="_blank">
    <img src="tempteria-ssl-sw.png" alt="SSL Icon">
</a>
</body>
</html>
